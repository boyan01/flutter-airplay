name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Dart checks and Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      macos: ${{ steps.changes.outputs.macos }}
      windows: ${{ steps.changes.outputs.windows }}
      android: ${{ steps.changes.outputs.android }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          base: ${{ github.event.before || github.event.repository.default_branch }}
          predicate-quantifier: some-with-excludes
          filters: |
            shared:
              - '.github/**'
              - 'pubspec.*'
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'test_driver/**'
              - 'assets/**'
              - 'native/**'
              - 'vendor/**'
              - 'scripts/**'
              - 'tool/**'
              - 'android/app/src/main/cpp/**'
              - 'android/app/src/main/assets/**'
              - '!**/*.md'
            macos:
              - 'macos/**'
              - '!**/*.md'
            linux:
              - 'linux/**'
              - '!**/*.md'
            windows:
              - 'windows/**'
              - '!**/*.md'
            android:
              - 'android/**'
              - '!**/*.md'
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test native build preparation
        run: ./scripts/test_native.sh build
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Identify Dart build cache
        id: dart-cache
        shell: bash
        run: |
          echo "sdk=$(git -C "$FLUTTER_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache Dart build tools and native assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .dart_tool/build
            .dart_tool/pub/bin/build_runner
            .dart_tool/hooks_runner
          # Keep SDK, system toolchain and package changes out of the fallback.
          # Build runner and hooks still validate their inputs on every run.
          key: linux-dart-v1-${{ steps.dart-cache.outputs.image }}-${{ steps.dart-cache.outputs.sdk }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-dart-v1-${{ steps.dart-cache.outputs.image }}-${{ steps.dart-cache.outputs.sdk }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}-
      - name: Check generated JSON serializers
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/receiver/receiver_settings.g.dart lib/receiver/receiver_state.g.dart lib/receiver/native/receiver_codec.g.dart
      - name: Check generated FFI bindings
        shell: bash
        run: |
          find_libclang() {
            python3 - <<'CLANG_PROBE'
          import ctypes
          import glob
          import re
          import sys

          # Probe the C API, not merely a clang executable or a development symlink.
          paths = glob.glob('/usr/lib/llvm-*/lib/libclang.so*')
          paths += glob.glob('/usr/lib/*/libclang-*.so*')
          def version(path):
              match = re.search(r'(?:llvm-|libclang-)(\d+)', path)
              return int(match.group(1)) if match else 0
          for path in sorted(set(paths), key=version, reverse=True):
              try:
                  library = ctypes.CDLL(path)
                  library.clang_parseTranslationUnit2
                  library.clang_createIndex.argtypes = [ctypes.c_int, ctypes.c_int]
                  library.clang_createIndex.restype = ctypes.c_void_p
                  library.clang_disposeIndex.argtypes = [ctypes.c_void_p]
                  library.clang_disposeIndex.restype = None
                  index = library.clang_createIndex(0, 0)
                  if not index:
                      continue
                  library.clang_disposeIndex(index)
              except (OSError, AttributeError):
                  continue
              print(path)
              sys.exit(0)
          sys.exit(1)
          CLANG_PROBE
          }
          if ! libclang=$(find_libclang); then
            echo 'No usable preinstalled libclang C API; installing the fallback.'
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libclang-dev
            libclang=$(find_libclang)
          fi
          echo "Using libclang: $libclang"
          # Keep relative header/output paths anchored beside the authoritative config.
          config=$(mktemp tool/ffigen_ci_XXXXXX.yaml)
          trap 'rm -f "$config"' EXIT
          cp tool/ffigen_receiver.yaml "$config"
          printf '\nllvm-path:\n  - "%s"\n' "$libclang" >> "$config"
          dart run ffigen --config "$config"
          git diff --exit-code -- lib/receiver/native/generated/receiver_bindings.dart
      - name: Check Dart format
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Analyze Dart
        run: flutter analyze --no-pub --fatal-infos
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libavahi-client-dev libepoxy-dev libffmpeg-nvenc-dev \
            libssl-dev libplist-dev libx11-dev libxi-dev ffmpeg \
            xvfb xauth dbus-x11 at-spi2-core openbox xdotool x11-utils
      - name: Run Dart tests
        run: flutter test --no-pub
      - name: Run desktop integration suite
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.linux == 'true'
        timeout-minutes: 15
        shell: bash
        env:
          GIO_USE_VFS: local
          GTK_USE_PORTAL: '0'
          NO_AT_BRIDGE: '1'
        run: |
          mkdir -p artifacts/linux
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- bash -euo pipefail <<'DESKTOP' 2>&1 | tee artifacts/linux/desktop.log
            openbox --sm-disable > artifacts/linux/openbox.log 2>&1 &
            wm=$!
            trap 'kill "$wm" 2>/dev/null || true' EXIT
            for _attempt in {1..100}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then
                break
              fi
              kill -0 "$wm"
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"
            flutter test --no-pub -d linux integration_test/desktop_test.dart --reporter expanded
          DESKTOP
      - name: Run player, video, host and GTK tests using integration build output
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.shared == 'true' || steps.changes.outputs.linux == 'true'
        run: ./scripts/test_native.sh linux all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: linux-test-logs
          path: |
            artifacts/linux/
            build/linux-native/Testing/Temporary/
          retention-days: 7

  macos:
    name: macOS native and Debug app
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run desktop integration suite
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p artifacts/macos
          flutter test -d macos integration_test/desktop_test.dart --reporter expanded 2>&1 | tee artifacts/macos/desktop.log
      - name: Run macOS native tests using integration build output
        run: ./scripts/test_native.sh macos all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: macos-test-logs
          path: |
            artifacts/macos/
            build/macos-native/Testing/Temporary/
          retention-days: 7

  windows:
    name: Windows native and Debug app
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve shell script line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Ensure Media Foundation is available
        shell: powershell
        run: |
          # Check the runtime before loading the slow ServerManager module.
          $probe = @'
          import ctypes
          import sys

          try:
              library = ctypes.WinDLL('mfplat.dll')
              library.MFStartup.argtypes = [ctypes.c_ulong, ctypes.c_ulong]
              library.MFStartup.restype = ctypes.c_long
              library.MFShutdown.restype = ctypes.c_long
              result = library.MFStartup(0x00020070, 0)
              if result < 0:
                  raise OSError(f'MFStartup failed: 0x{result & 0xffffffff:08x}')
              result = library.MFShutdown()
              if result < 0:
                  raise OSError(f'MFShutdown failed: 0x{result & 0xffffffff:08x}')
          except (OSError, AttributeError) as error:
              print(error)
              sys.exit(1)
          print('Media Foundation runtime is available.')
          '@
          $probe | python -
          if ($LASTEXITCODE -ne 0) {
            $result = Install-WindowsFeature Server-Media-Foundation
            if (-not $result.Success -or $result.RestartNeeded -eq 'Yes') {
              throw 'Media Foundation could not be enabled without restarting the runner.'
            }
            $probe | python -
            if ($LASTEXITCODE -ne 0) {
              throw 'Media Foundation runtime is unavailable after installation.'
            }
          }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: MSYS
          install: make diffutils
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
          # Restoring thousands of small package files is slower on Windows
          # than downloading the locked packages with pub.
          pub-cache: false
      - run: flutter pub get --enforce-lockfile
      - name: Identify Windows dependency toolchain
        id: native-toolchain
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $version = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            throw 'Could not identify the Visual Studio toolchain.'
          }
          $vsInstall = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw 'Could not locate the Visual Studio toolchain.'
          }
          & "$vsInstall/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not $env:VCToolsVersion -or -not $env:WindowsSDKVersion -or $env:VSCMD_ARG_TGT_ARCH -ne 'x64') {
            throw 'Could not identify the x64 MSVC toolset and Windows SDK.'
          }
          $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          $flutterRevision = & git -C $env:FLUTTER_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not identify the Flutter SDK revision.'
          }
          "sdk=$flutterRevision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Runner image updates alone do not change these compiled dependencies.
          "version=$version-msvc$env:VCToolsVersion-sdk$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache Windows native dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/windows-deps/crypto
            build/windows-deps/ffmpeg-aac
            build/native-preparation/windows-dependencies.txt
          key: windows-native-deps-v2-windows2022-x64-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('native/dependencies.lock.json', 'windows/scripts/build_dependencies.ps1', 'windows/scripts/build_ffmpeg.sh', 'windows/scripts/build_native.ps1', 'scripts/ensure_native.py') }}
      - name: Cache Windows Dart native assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .dart_tool/hooks_runner
          # Hooks still validate package sources and build inputs on every run.
          key: windows-dart-v1-${{ steps.native-toolchain.outputs.image }}-${{ steps.native-toolchain.outputs.version }}-${{ steps.native-toolchain.outputs.sdk }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-dart-v1-${{ steps.native-toolchain.outputs.image }}-${{ steps.native-toolchain.outputs.version }}-${{ steps.native-toolchain.outputs.sdk }}-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}-
      - name: Run desktop integration suite
        timeout-minutes: 15
        shell: bash
        env:
          AIRPLAY_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
          AIRPLAY_MAKE: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe
        run: |
          mkdir -p artifacts/windows
          flutter.bat test --no-pub -d windows integration_test/desktop_test.dart --reporter expanded 2>&1 | tee artifacts/windows/desktop.log
      - name: Build native fixtures using integration build output
        env:
          AIRPLAY_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
          AIRPLAY_MAKE: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe
        run: |
          ./windows/scripts/build_native.ps1 -Tests
          # The integration build already produced Flutter and its wrappers.
          # Reuse them without rerunning Flutter's temporary test entrypoint.
          cmake --build build/windows/x64 --config Debug --target windows_texture_test -- /p:BuildProjectReferences=false
      - name: Run native tests
        shell: bash
        run: ./scripts/test_native.sh windows all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: windows-test-logs
          path: |
            artifacts/windows/
            build/windows-native/Testing/Temporary/
            build/windows/x64/Testing/Temporary/
          retention-days: 7

  android:
    name: Android JNI, host, Kotlin and Debug app
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl python3 libssl-dev
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install project Android native toolchain
        run: |
          ndk_version=$(sed -n 's/^airplay\.ndkVersion=//p' android/gradle.properties)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then sdkmanager="$candidate"; fi
            done
          fi
          [[ -x "$sdkmanager" ]] || { echo 'Android SDK command-line tools are missing.' >&2; exit 1; }
          "$sdkmanager" "ndk;$ndk_version" 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile Debug app and prepare Gradle wrapper
        run: flutter build apk --debug --target-platform android-arm64
      - name: Run host protocol tests
        run: ./scripts/test_native.sh android host
      - name: Run Kotlin unit tests
        run: GRADLE_BIN="$PWD/android/gradlew" ./scripts/test_native.sh android kotlin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: android-test-logs
          path: |
            artifacts/android/
            build/app/reports/tests/
            build/app/test-results/
          retention-days: 7

  flutter-stable:
    name: Verify new Flutter stable
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/receiver/receiver_settings.g.dart lib/receiver/receiver_state.g.dart lib/receiver/native/receiver_codec.g.dart
      - run: flutter analyze
      - run: flutter test
      - run: dart run ffigen --config tool/ffigen_receiver.yaml
      - run: git diff --exit-code -- lib/receiver/native/generated/receiver_bindings.dart
      - run: ./scripts/test_native.sh build
