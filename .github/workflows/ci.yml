name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze and Dart tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      flutter_version: ${{ steps.sdk.outputs.version }}
      shared: ${{ steps.changes.outputs.shared }}
      macos: ${{ steps.changes.outputs.macos }}
      linux: ${{ steps.changes.outputs.linux }}
      windows: ${{ steps.changes.outputs.windows }}
      android: ${{ steps.changes.outputs.android }}
      ios: ${{ steps.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          base: ${{ github.event.before || github.event.repository.default_branch }}
          predicate-quantifier: some-with-excludes
          filters: |
            shared:
              - '.github/**'
              - 'pubspec.*'
              - '.flutter-version'
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'test_driver/**'
              - 'assets/**'
              - 'native/**'
              - 'vendor/**'
              - 'scripts/**'
              - 'tool/**'
              - 'android/app/src/main/cpp/**'
              - 'android/app/src/main/assets/**'
              - '!**/*.md'
            macos:
              - 'macos/**'
              - '!**/*.md'
            linux:
              - 'linux/**'
              - '!**/*.md'
            windows:
              - 'windows/**'
              - '!**/*.md'
            android:
              - 'android/**'
              - '!**/*.md'
            ios:
              - 'ios/**'
              - '!**/*.md'
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test native build preparation
        run: ./scripts/test_native.sh build
      - name: Read pinned Flutter SDK
        id: sdk
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check generated JSON serializers
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/receiver/receiver_settings.g.dart lib/receiver/receiver_state.g.dart lib/receiver/native/receiver_codec.g.dart
      - name: Check generated FFI bindings
        shell: bash
        run: |
          find_libclang() {
            python3 - <<'CLANG_PROBE'
          import ctypes
          import glob
          import re
          import sys

          # Probe the C API, not merely a clang executable or a development symlink.
          paths = glob.glob('/usr/lib/llvm-*/lib/libclang.so*')
          paths += glob.glob('/usr/lib/*/libclang-*.so*')
          def version(path):
              match = re.search(r'(?:llvm-|libclang-)(\d+)', path)
              return int(match.group(1)) if match else 0
          for path in sorted(set(paths), key=version, reverse=True):
              try:
                  library = ctypes.CDLL(path)
                  library.clang_parseTranslationUnit2
                  library.clang_createIndex.argtypes = [ctypes.c_int, ctypes.c_int]
                  library.clang_createIndex.restype = ctypes.c_void_p
                  library.clang_disposeIndex.argtypes = [ctypes.c_void_p]
                  library.clang_disposeIndex.restype = None
                  index = library.clang_createIndex(0, 0)
                  if not index:
                      continue
                  library.clang_disposeIndex(index)
              except (OSError, AttributeError):
                  continue
              print(path)
              sys.exit(0)
          sys.exit(1)
          CLANG_PROBE
          }
          if ! libclang=$(find_libclang); then
            echo 'No usable preinstalled libclang C API; installing the fallback.'
            sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libclang-dev
            libclang=$(find_libclang)
          fi
          echo "Using libclang: $libclang"
          # Keep relative header/output paths anchored beside the authoritative config.
          config=$(mktemp tool/ffigen_ci_XXXXXX.yaml)
          trap 'rm -f "$config"' EXIT
          cp tool/ffigen_receiver.yaml "$config"
          printf '\nllvm-path:\n  - "%s"\n' "$libclang" >> "$config"
          dart run ffigen --config "$config"
          git diff --exit-code -- lib/receiver/native/generated/receiver_bindings.dart
      - name: Check Dart format
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Analyze Dart
        run: flutter analyze --fatal-infos
      - name: Install native assets test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - name: Run Dart tests
        run: flutter test

  macos:
    name: macOS native and Debug app
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.quality.outputs.flutter_version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile Debug app
        run: flutter build macos --debug
      - name: Run all macOS native and window tests
        run: ./scripts/test_native.sh macos all
      - name: Run desktop integration suite
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p artifacts/macos
          ./scripts/test_native.sh macos desktop --os-input 2>&1 | tee artifacts/macos/desktop.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: macos-test-logs
          path: |
            artifacts/macos/
            build/macos-native/Testing/Temporary/
          retention-days: 7

  linux:
    name: Linux native, GTK and Debug app
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native and virtual desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libavahi-client-dev libepoxy-dev libffmpeg-nvenc-dev \
            libssl-dev libplist-dev libx11-dev libxi-dev ffmpeg \
            xvfb dbus-x11 at-spi2-core openbox xdotool x11-utils
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.quality.outputs.flutter_version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile Debug app and prepare Flutter engine
        run: flutter build linux --debug
      - name: Run player, video, host and GTK tests
        run: ./scripts/test_native.sh linux all
      - name: Run desktop integration suite
        timeout-minutes: 15
        shell: bash
        env:
          GIO_USE_VFS: local
          GTK_USE_PORTAL: '0'
          NO_AT_BRIDGE: '1'
        run: |
          mkdir -p artifacts/linux
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- bash -euo pipefail <<'DESKTOP' 2>&1 | tee artifacts/linux/desktop.log
            openbox --sm-disable > artifacts/linux/openbox.log 2>&1 &
            wm=$!
            trap 'kill "$wm" 2>/dev/null || true' EXIT
            for _attempt in {1..100}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then
                break
              fi
              kill -0 "$wm"
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"
            ./scripts/test_native.sh linux desktop --os-input
          DESKTOP
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: linux-test-logs
          path: |
            artifacts/linux/
            build/linux-native/Testing/Temporary/
          retention-days: 7

  windows:
    name: Windows native, Debug app and Setup
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Preserve shell script line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Ensure Media Foundation is available
        shell: powershell
        run: |
          if (-not (Get-WindowsFeature Server-Media-Foundation).Installed) {
            $result = Install-WindowsFeature Server-Media-Foundation
            if (-not $result.Success -or $result.RestartNeeded -eq 'Yes') {
              throw 'Media Foundation could not be enabled without restarting the runner.'
            }
          }
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: MSYS
          install: make diffutils
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.quality.outputs.flutter_version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Identify Windows dependency toolchain
        id: native-toolchain
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $version = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            throw 'Could not identify the Visual Studio toolchain.'
          }
          $vsInstall = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw 'Could not locate the Visual Studio toolchain.'
          }
          & "$vsInstall/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if (-not $env:VCToolsVersion -or -not $env:WindowsSDKVersion -or $env:VSCMD_ARG_TGT_ARCH -ne 'x64') {
            throw 'Could not identify the x64 MSVC toolset and Windows SDK.'
          }
          $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          # Runner image updates alone do not change these compiled dependencies.
          "version=$version-msvc$env:VCToolsVersion-sdk$sdk" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Cache Windows native dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/windows-deps/crypto
            build/windows-deps/ffmpeg-aac
            build/native-preparation/windows-dependencies.txt
          key: windows-native-deps-v2-windows2022-x64-${{ steps.native-toolchain.outputs.version }}-${{ hashFiles('native/dependencies.lock.json', 'windows/scripts/build_dependencies.ps1', 'windows/scripts/build_ffmpeg.sh', 'windows/scripts/build_native.ps1', 'scripts/ensure_native.py') }}
      - name: Compile Debug app with automatic native preparation
        env:
          AIRPLAY_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
          AIRPLAY_MAKE: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe
        run: flutter build windows --debug
      - name: Build native fixtures
        env:
          AIRPLAY_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
          AIRPLAY_MAKE: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe
        run: |
          ./windows/scripts/build_native.ps1 -Tests
          cmake --build build/windows/x64 --config Debug --target windows_texture_test
      - name: Run native tests
        shell: bash
        run: ./scripts/test_native.sh windows all
      - name: Run desktop integration suite
        timeout-minutes: 15
        shell: bash
        env:
          AIRPLAY_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
          AIRPLAY_MAKE: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe
        run: |
          mkdir -p artifacts/windows
          ./scripts/test_native.sh windows desktop --os-input 2>&1 | tee artifacts/windows/desktop.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: windows-test-logs
          path: |
            artifacts/windows/
            build/windows-native/Testing/Temporary/
            build/windows/x64/Testing/Temporary/
          retention-days: 7

      - name: Prepare Inno Setup compiler
        shell: powershell
        run: |
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
            throw 'Inno Setup compiler download SHA-256 mismatch.'
          }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno-6.7.3'
          $process = Start-Process -FilePath $compilerSetup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /PORTABLE=1 /NOICONS /DIR=`"$compilerDir`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup portable compiler preparation failed.' }
          "AIRPLAY_ISCC=$compilerDir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows Release installer
        env:
          AIRPLAY_BASH: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe
          AIRPLAY_MAKE: ${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe
        run: ./windows/scripts/package_windows.ps1 -InnoCompiler $env:AIRPLAY_ISCC
      - name: Verify install, upgrade, startup and uninstall
        shell: bash
        run: ./scripts/test_native.sh windows installer build/distribution/windows/Flutter-AirPlay-*-windows-x64-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: windows-installer-logs
          path: artifacts/windows-installer-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64-setup
          path: |
            build/distribution/windows/*-setup.exe
            build/distribution/windows/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android JNI, host, Kotlin and Debug app
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build perl python3 libssl-dev
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.quality.outputs.flutter_version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Install project Android native toolchain
        run: |
          ndk_version=$(sed -n 's/^airplay\.ndkVersion=//p' android/gradle.properties)
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [[ -x "$candidate" ]]; then sdkmanager="$candidate"; fi
            done
          fi
          [[ -x "$sdkmanager" ]] || { echo 'Android SDK command-line tools are missing.' >&2; exit 1; }
          "$sdkmanager" "ndk;$ndk_version" 'cmake;3.22.1' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile Debug app and prepare Gradle wrapper
        run: flutter build apk --debug --target-platform android-arm64
      - name: Run host protocol tests
        run: ./scripts/test_native.sh android host
      - name: Run Kotlin unit tests
        run: GRADLE_BIN="$PWD/android/gradlew" ./scripts/test_native.sh android kotlin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: android-test-logs
          path: |
            artifacts/android/
            build/app/reports/tests/
            build/app/test-results/
          retention-days: 7

  ios:
    name: iPad simulator XCTest
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.shared == 'true' || needs.quality.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.quality.outputs.flutter_version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Prepare simulator Debug app
        run: flutter build ios --simulator --debug --no-codesign
      - name: Run XCTest on an available iPad simulator
        run: ./scripts/test_native.sh ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ios-test-results
          path: artifacts/ios/
          retention-days: 7

  flutter-stable:
    name: Verify new Flutter stable
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/receiver/receiver_settings.g.dart lib/receiver/receiver_state.g.dart lib/receiver/native/receiver_codec.g.dart
      - run: flutter analyze
      - run: flutter test
      - run: dart run ffigen --config tool/ffigen_receiver.yaml
      - run: git diff --exit-code -- lib/receiver/native/generated/receiver_bindings.dart
      - run: ./scripts/test_native.sh build
