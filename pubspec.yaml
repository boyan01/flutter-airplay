name: flutter_airplay
description: "Open-source AirPlay receiver with Flutter controls and native playback."
publish_to: none
version: 0.1.2+3

environment:
  sdk: ^3.13.2

dependencies:
  archive: ^4.3.0
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  mixin_logger: ^0.2.0
  nativeapi: 0.4.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - android/app/src/main/assets/licenses/
    - lib/l10n/app_en.arb
    - lib/l10n/app_zh.arb
